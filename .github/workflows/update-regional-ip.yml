name: Update regional IP rules
'on':
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-regional-ip.yml'
      - 'scripts/build_regions.py'
      - 'scripts/geoip_reader.py'
      - 'scripts/test_regions.py'
      - 'region-sources.json'
      - 'scripts/build_compact.py'
      - 'scripts/test_compact.py'
      - 'compact-sources.json'
      - 'scripts/build_dns_cn.py'
      - 'scripts/test_dns_cn.py'
      - 'scripts/build_mobile_rules.py'
      - 'scripts/test_mobile_rules.py'
permissions:
  contents: read
concurrency:
  group: update-regional-ip
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Test region builder
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Download verified converter and current GeoIP data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/regional-ip"
          cd "$RUNNER_TEMP/regional-ip"
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-v1-v1.19.32.gz -o mihomo.gz
          echo '306f81e723e60ce6b828899a6fe83e1d00e9ecefb2dc8d4d849312a5bc00efdc  mihomo.gz' | sha256sum --check --strict
          gzip -d mihomo.gz
          chmod +x mihomo
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            https://raw.githubusercontent.com/Loyalsoldier/geoip/release/geoip.dat -o geoip.dat
      - name: Rebuild all 16 regions and verify exact IP coverage
        run: |
          python3 scripts/build_regions.py \
            --geoip "$RUNNER_TEMP/regional-ip/geoip.dat" \
            --mihomo "$RUNNER_TEMP/regional-ip/mihomo" \
            --source-url https://raw.githubusercontent.com/Loyalsoldier/geoip/release/geoip.dat \
            --output rules/regions
      - name: Build compact rules with coverage and canonical round-trip checks
        run: |
          python3 scripts/build_compact.py \
            --regions rules/regions \
            --mihomo "$RUNNER_TEMP/regional-ip/mihomo" \
            --output rules/compact
      - name: Recompress official CN DNS rules without changing decoded data
        run: python3 scripts/build_dns_cn.py --output rules/dns-cn
      - name: Build mobile application rules without ASN-wide matches
        run: python3 scripts/build_mobile_rules.py --output rules/mobile
      - name: Publish only verified public rules
        shell: bash
        run: |
          set -euo pipefail
          git add -- rules/regions/*.mrs rules/regions/manifest.json
          git add -- rules/compact/*.mrs rules/compact/manifest.json
          git add -- rules/dns-cn/cn.mrs rules/dns-cn/manifest.json
          git add -- rules/mobile/*.yaml rules/mobile/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update verified regional IP rules'
          git push origin HEAD:main
